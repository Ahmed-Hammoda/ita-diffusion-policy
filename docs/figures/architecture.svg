<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .t  { fill: #0f172a; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s  { fill: #475569; font-size: 11.5px; text-anchor: middle; }
      .i  { fill: #475569; font-size: 11.5px; font-style: italic; text-anchor: middle; }
      .tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .lbl { fill: #475569; font-size: 11.5px; }
      .in  { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .fz  { fill: #e8eef6; stroke: #7b8ba3; stroke-width: 1.2; }
      .tr  { fill: #fff3e6; stroke: #ea580c; stroke-width: 1.4; }
      .sm  { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; }
      .ln  { stroke: #475569; stroke-width: 1.5; fill: none; }
      .lg  { stroke: #059669; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="519" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- regions -->
  <rect x="198" y="54" width="194" height="172" rx="10" fill="#f4f7fb" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="206" y="46" class="tag" fill="#64748b">FROZEN · PRETRAINED</text>
  <rect x="400" y="54" width="364" height="406" rx="10" fill="#fffaf4" stroke="#fdba74" stroke-dasharray="5 4"/>
  <text x="408" y="46" class="tag" fill="#c2410c">TRAINED FROM SCRATCH</text>

  <!-- inputs -->
  <rect x="20" y="65"  width="160" height="42" rx="7" class="in"/>
  <text x="100" y="82"  class="t">Instruction</text>
  <text x="100" y="99"  class="i">“open the middle drawer”</text>

  <rect x="20" y="123" width="160" height="42" rx="7" class="in"/>
  <text x="100" y="140" class="t">Scene camera</text>
  <text x="100" y="157" class="s">RGB image</text>

  <rect x="20" y="181" width="160" height="42" rx="7" class="in"/>
  <text x="100" y="198" class="t">Wrist camera</text>
  <text x="100" y="215" class="s">RGB image</text>

  <rect x="20" y="241" width="160" height="42" rx="7" class="in"/>
  <text x="100" y="258" class="t">Robot state</text>
  <text x="100" y="275" class="s">8-D proprioception</text>

  <!-- frozen encoders -->
  <rect x="210" y="65"  width="170" height="42" rx="7" class="fz"/>
  <text x="295" y="82"  class="t">CLIP text encoder</text>
  <text x="295" y="99"  class="s">ViT-B/32 · 512-d</text>

  <rect x="210" y="123" width="170" height="42" rx="7" class="fz"/>
  <text x="295" y="140" class="t">DINOv2 ViT-S/14</text>
  <text x="295" y="157" class="s">CLS token · 384-d</text>

  <rect x="210" y="181" width="170" height="42" rx="7" class="fz"/>
  <text x="295" y="198" class="t">DINOv2 ViT-S/14</text>
  <text x="295" y="215" class="s">shared weights · 384-d</text>

  <line x1="180" y1="86"  x2="210" y2="86"  class="ln" marker-end="url(#arrow)"/>
  <line x1="180" y1="144" x2="210" y2="144" class="ln" marker-end="url(#arrow)"/>
  <line x1="180" y1="202" x2="210" y2="202" class="ln" marker-end="url(#arrow)"/>

  <!-- observation projection -->
  <rect x="410" y="65" width="110" height="218" rx="7" class="tr"/>
  <text x="465" y="152" class="t">Linear proj.</text>
  <text x="465" y="171" class="s">+ type emb.</text>
  <text x="465" y="188" class="s">+ pos. enc.</text>
  <text x="465" y="214" class="i">7 tokens</text>

  <line x1="380" y1="86"  x2="410" y2="86"  class="ln" marker-end="url(#arrow)"/>
  <line x1="380" y1="144" x2="410" y2="144" class="ln" marker-end="url(#arrow)"/>
  <line x1="380" y1="202" x2="410" y2="202" class="ln" marker-end="url(#arrow)"/>
  <line x1="180" y1="262" x2="410" y2="262" class="ln" marker-end="url(#arrow)"/>

  <!-- transformer encoder -->
  <rect x="560" y="114" width="190" height="120" rx="7" class="tr"/>
  <text x="655" y="162" class="t">Transformer Encoder</text>
  <text x="655" y="182" class="s">4 layers · self-attention</text>
  <text x="655" y="199" class="s">d = 256 · 8 heads</text>
  <line x1="520" y1="174" x2="560" y2="174" class="ln" marker-end="url(#arrow)"/>

  <!-- memory -->
  <line x1="655" y1="234" x2="655" y2="330" class="ln" marker-end="url(#arrow)"/>
  <text x="664" y="278" class="lbl">memory</text>
  <text x="664" y="293" class="lbl" fill="#64748b">(keys, values)</text>

  <!-- action branch inputs -->
  <rect x="20" y="397" width="160" height="42" rx="7" class="in"/>
  <text x="100" y="414" class="t">Gaussian noise</text>
  <text x="100" y="431" class="i">x ~ N(0, I)</text>

  <rect x="210" y="331" width="170" height="42" rx="7" class="in"/>
  <text x="295" y="348" class="t">Diffusion step k</text>
  <text x="295" y="365" class="s">sinusoidal embedding</text>

  <rect x="210" y="397" width="170" height="42" rx="7" class="in"/>
  <text x="295" y="414" class="t">Noisy action chunk</text>
  <text x="295" y="431" class="s">16 × 7</text>

  <line x1="180" y1="418" x2="210" y2="418" class="ln" marker-end="url(#arrow)"/>

  <!-- action projection -->
  <rect x="410" y="331" width="110" height="108" rx="7" class="tr"/>
  <text x="465" y="372" class="t">Linear proj.</text>
  <text x="465" y="391" class="s">+ pos. enc.</text>
  <text x="465" y="408" class="s">+ step emb.</text>
  <line x1="380" y1="352" x2="410" y2="352" class="ln" marker-end="url(#arrow)"/>
  <line x1="380" y1="418" x2="410" y2="418" class="ln" marker-end="url(#arrow)"/>

  <!-- transformer decoder -->
  <rect x="560" y="330" width="190" height="110" rx="7" class="tr"/>
  <text x="655" y="371" class="t">Transformer Decoder</text>
  <text x="655" y="391" class="s">4 layers · self + cross-attn</text>
  <text x="655" y="408" class="s">predicts the added noise</text>
  <line x1="520" y1="385" x2="560" y2="385" class="ln" marker-end="url(#arrow)"/>

  <!-- sampling -->
  <rect x="790" y="345" width="170" height="80" rx="7" class="sm"/>
  <text x="875" y="380" class="t">DDIM update</text>
  <text x="875" y="398" class="s">remove one noise step</text>
  <line x1="750" y1="385" x2="790" y2="385" class="ln" marker-end="url(#arrow)"/>

  <!-- denoising loop -->
  <path d="M875,425 V480 H295 V439" class="lg" marker-end="url(#arrow-green)"/>
  <text x="585" y="500" class="s" fill="#047857">repeat 10 times (k = 90, 80, …, 0)</text>

  <!-- output -->
  <rect x="790" y="134" width="170" height="80" rx="7" class="sm" stroke-width="2"/>
  <text x="875" y="162" class="t">Action chunk</text>
  <text x="875" y="181" class="s">16 steps × 7-D</text>
  <text x="875" y="198" class="s">first 8 sent to the robot</text>
  <line x1="875" y1="345" x2="875" y2="214" class="lg" marker-end="url(#arrow-green)"/>
  <text x="867" y="284" class="lbl" fill="#047857" text-anchor="end">after the</text>
  <text x="867" y="299" class="lbl" fill="#047857" text-anchor="end">last step</text>
</svg>
